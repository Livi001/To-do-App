<div class="container mt-5">
    <div class="card p-4 shadow-lg rounded">
      <h2 class="text-center mb-4">To-Do Liste</h2>
  
      <!-- Input field and Add button -->
      <div class="input-group mb-3" *ngIf="editingTaskIndex === null">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="todoItem"
          placeholder="Enter a new task"
          aria-label="Enter a new task"
          aria-describedby="addButton"
          (keydown.enter)="addTodo()"  
        />
        <button
          class="btn btn-primary"
          (click)="addTodo()"
          id="addButton"
          [disabled]="!todoItem"
        >
          Add
        </button>
      </div>
  
      <!-- Task list -->
      <ul class="list-group">
        <li *ngFor="let task of todoList; let i = index" class="list-group-item d-flex justify-content-between align-items-center">
          <!-- Checkbox to mark task as completed -->
          <input 
            type="checkbox" 
            [checked]="task.completed"
            (change)="toggleCompletion(i)" 
            class="me-2"
          />
          
          <!-- Display task name -->
          <span [ngClass]="{ 'text-decoration-line-through': task.completed }">
            <!-- If task is being edited, show the input field; otherwise, show the task name -->
            <ng-container *ngIf="editingTaskIndex !== i">
              {{ task.name }}
            </ng-container>
            <ng-container *ngIf="editingTaskIndex === i">
              <div class="d-flex w-100 align-items-center">
                <input 
                  type="text" 
                  class="form-control me-2 w-75"  
                  [(ngModel)]="todoItem"
                  (keyup.enter)="saveEdit(i)"
                  placeholder="Edit your task"
                />
                <button class="btn btn-success btn-sm" (click)="saveEdit(i)">Save</button>
                <button class="btn btn-secondary btn-sm ms-2" (click)="cancelEdit()">Cancel</button>
              </div>
            </ng-container>
          </span>
  
          <!-- Normal task view -->
          <div *ngIf="editingTaskIndex !== i" class="d-flex justify-content-end">
            <button class="btn btn-warning btn-sm me-2" (click)="editTask(i, task)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="removeTodo(i)">Delete</button>
          </div>
        </li>
      </ul>
    </div>
  </div>
